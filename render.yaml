services:
  - type: web
    name: pingalabit
    env: static
    buildCommand: ""
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=3600, stale-while-revalidate=86400
      - path: /*.html
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
    routes:
      - type: rewrite
        source: /
        destination: /index.html
      - type: rewrite
        source: /home
        destination: /index.html
      - type: rewrite
        source: /learn
        destination: /learn.html
      - type: rewrite
        source: /quiz
        destination: /quiz.html
      - type: rewrite
        source: /course
        destination: /course.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /404
        destination: /404.html
